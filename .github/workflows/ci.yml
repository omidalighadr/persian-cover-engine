name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libraqm0 libfribidi0
      - run: pip install -e ".[dev,fallback-shaping]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        shaping: [raqm, reshaper]
    env:
      PERSIAN_COVER_SHAPING: ${{ matrix.shaping }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libraqm0 libfribidi0
      - run: pip install -e ".[dev,fallback-shaping]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t persian-cover-engine .
      - run: docker run --rm -v "$PWD/out:/out" persian-cover-engine "سلام دنیا" --out /out/cover.png
      - run: test -s out/cover.png
